# Git and MCP integration (optional): the Integrations panel, with "git
# clone" of a project and push back (Overleaf's git-bridge service), and
# an MCP server per project for AI tools (Claude Code, Cursor, VS Code),
# at https://your.site/project/<id>/mcp. Both use the tokens users make in
# Account settings › Git integration.
# Turn it on by adding this file to COMPOSE_FILE in .env (deploy/README.md,
# "Git and MCP integration"). Clones go through SumiTeX's own address
# (https://your.site/git/<project id>), so the reverse proxy needs nothing new.
services:
  sumitex:
    environment:
      GIT_BRIDGE_ENABLED: "true"
      GIT_BRIDGE_HOST: git-bridge
      GIT_BRIDGE_PORT: "8000"

  git-bridge:
    image: ${GIT_BRIDGE_IMAGE:-quay.io/sharelatex/git-bridge:latest}
    container_name: sumitex-git-bridge
    restart: always
    depends_on:
      - sumitex
    # No port of its own: SumiTeX's nginx passes /git/<project> on to it
    environment:
      # SumiTeX's own address inside Docker (its nginx, port 80)
      GIT_BRIDGE_API_BASE_URL: http://sumitex/api/v0
      GIT_BRIDGE_OAUTH2_SERVER: http://sumitex
      GIT_BRIDGE_POSTBACK_BASE_URL: http://git-bridge:8000
      GIT_BRIDGE_ROOT_DIR: /data/git-bridge
    # The service runs as user 1000: sudo chown 1000:1000 this folder
    volumes:
      - ${SUMITEX_DATA_DIR}/git-bridge:/data/git-bridge
